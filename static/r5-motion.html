<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stage R5 — Motion/Expression/Effects in-frame + Engine MAIN regression</title>
<style>
  html, body { margin: 0; height: 100%; background: #e8e8e8; overflow: hidden; }
  #prod { position: fixed; inset: 0; }
  #status {
    position: fixed; top: 10px; left: 10px; z-index: 5;
    padding: 10px 14px; border-radius: 8px; max-width: 700px; max-height: 92vh; overflow: auto;
    background: rgba(0,0,0,.82); border: 1px solid #3a332a;
    color: #e8e0d5; font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap;
  }
  #status.ok { border-color: #2e8b57; } #status.fail { border-color: #b03a3a; color: #ffb3b3; }
</style>
<script src="js/live2dcubismcore.min.js"></script>
<script src="js/cubism-framework.js"></script>
<script src="js/live2d-adapter.js"></script>
<script src="js/pixi8-namespace.js"></script>
</head>
<body>
<canvas id="prod"></canvas>
<div id="status">booting…</div>
<script>
(async function () {
  "use strict";
  const el = document.getElementById("status");
  const lines = [];
  const log = (m, cls) => { lines.push(m); el.textContent = lines.slice(-50).join("\n"); if (cls) el.className = cls; console.log("[r5]", m); };
  const results = [];
  const check = (name, ok, detail) => { results.push({ name, ok }); log((ok ? "PASS " : "FAIL ") + name + (detail ? " — " + detail : ""), ok ? null : "fail"); };
  const REN = "model/tesmodel/runtime/ren.model3.json";

  try {
    await window.__compositor8Ready;
    const api = window.__live2dApi;
    const host = api.createHost({
      canvas: document.getElementById("prod"),
      width: window.innerWidth, height: window.innerHeight,
      backgroundAlpha: 0, resolution: Math.min(window.devicePixelRatio || 1, 2),
      composite: "canvas-texture",
    });
    const model = await api.loadModel(host, { kind: "path", path: REN });
    host.add(model);

    // ── Motion: play → sampling kurva → completion in-frame ──
    const g = model.motionGroups()[0];
    check("R5 play motion", model.playNativeMotion(g, 0, 3) === true);
    const angleId = "ParamAngleX";
    const samples = new Set();
    let activeFrames = 0, completedAt = -1;
    for (let i = 1; i <= 900; i++) {
      model.update(1 / 60); host.render();
      if (!model.isMotionFinished()) {
        activeFrames++;
        samples.add(Math.round((model.getParameter(angleId) || 0) * 5));
      } else if (completedAt === -1) completedAt = i;
    }
    check("R5 motion aktif " + activeFrames + " frame, kurva " + samples.size + " nilai unik",
      activeFrames > 0 && samples.size > 1);
    check("R5 completion terdeteksi di frame " + completedAt, completedAt > activeFrames);
    check("R5 pasca-completion idle stabil", model.isMotionFinished() === true);

    // ── Expression in-frame ──
    const names = model.getProfile().expressions.map((e) => e.name);
    const before = new Map(model.getParameters().map((p) => [p.id, p.value]));
    check("R5 play expression", model.playExpression(names[0]) === true, names[0]);
    let changed = 0;
    for (let i = 0; i < 5; i++) {
      model.update(1 / 60); host.render();
      for (const p of model.getParameters())
        if (Math.abs(p.value - (before.get(p.id) ?? 0)) > 1e-4) changed++;
    }
    check("R5 expression mengubah parameter", changed > 0, changed + " param berubah");

    // ── Focus in-frame ──
    model.resetFocus();
    for (let i = 0; i < 10; i++) { model.update(1 / 60); }
    const baseEye = model.getParameter("ParamEyeBallX") || 0;
    model.setFocus(0.8, 0);
    for (let i = 0; i < 30; i++) { model.update(1 / 60); host.render(); }
    check("R5 focus → eyeBall mengikuti target",
      (model.getParameter("ParamEyeBallX") || 0) > baseEye + 0.3,
      "eyeX=" + (model.getParameter("ParamEyeBallX") || 0).toFixed(3));

    // ── exactly-once (R4 instruments tetap) ──
    const s0 = { ...model.data.stats };
    const r0 = host.renderStats();
    for (let i = 0; i < 100; i++) { model.update(1 / 60); host.render(); }
    const s1 = model.data.stats, r1 = host.renderStats();
    check("R5 exactly-once 100 frame (update/motion/scheduler/core/render/composite)",
      s1.frames - s0.frames === 100 && s1.motionUpdates - s0.motionUpdates === 100 &&
      s1.schedulerRuns - s0.schedulerRuns === 100 && s1.coreUpdates - s0.coreUpdates === 100 &&
      r1.renders - r0.renders === 100 && r1.composites - r0.composites === 100);

    model.destroy(); host.destroy();
    const allOk = results.every((r) => r.ok);
    log(allOk ? "SEMUA CHECK PASS (" + results.length + ")" :
      "GAGAL — " + results.filter((r) => !r.ok).map((r) => r.name).join("; "),
      allOk ? "ok" : "fail");
    window.__r5Results = results;
  } catch (e) {
    console.error(e);
    check("exception", false, String((e && (e.stack || e.message)) || e));
    el.className = "fail";
  }
})();
</script>
</body>
</html>
