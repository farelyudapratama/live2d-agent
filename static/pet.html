<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>Desktop Pet — Live2D Agent</title>
<style>
  /* Overlay desktop di jendela Chrome --app: body transparan, semua kontrol
     mengambang. Palet & anggaran render sama dengan app utama (static/css/app.css):
     warna solid, tanpa blur/gradient, bayangan hanya di elemen mengambang. */
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; height: 100%; }
  #stage { position: fixed; inset: 0; background: transparent; }
  #live2d-canvas { position: absolute; top: 0; left: 0; }
  #pet-ui {
    position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; padding: 3px;
    border-radius: 6px; background: #12151C; border: 1px solid #232936;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.42);
    opacity: 0.28; transition: opacity 0.18s ease;
  }
  #pet-ui:hover { opacity: 1; }
  .btn {
    border: 1px solid transparent; background: none; color: #9BA5B4;
    border-radius: 4px; padding: 5px 11px; cursor: pointer;
    font: 12px "Segoe UI", -apple-system, system-ui, sans-serif;
    transition: background-color 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }
  .btn:hover { background: #212734; border-color: #333B4B; color: #EDF0F4; }
  /* Tutup = merah hanya saat disentuh, supaya tidak menarik perhatian terus. */
  #b-close:hover { background: #2A1618; border-color: #5C2A2A; color: #DE4A45; }
  /* Klik-tembus aktif: hijau mint, penanda bahwa klik menembus desktop. */
  #b-through.active { background: #12231A; border-color: #235437; color: #21A557; }
  #bubble {
    position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);
    max-width: 320px; background: #12151C; color: #EDF0F4;
    border: 1px solid #333B4B; border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.48);
    padding: 9px 14px; display: none;
    font: 13px/1.55 "Segoe UI", -apple-system, system-ui, sans-serif;
  }
  #status {
    position: fixed; top: 6px; left: 8px;
    font: 10px ui-monospace, Consolas, monospace; color: #66707F;
  }
</style>
</head>
<body>
<div id="stage"><canvas id="live2d-canvas"></canvas></div>
<div id="status">pet</div>
<div id="bubble"><span id="bubble-text"></span></div>
<div id="pet-ui" data-tauri-drag-region>
  <button class="btn" id="b-wave" data-i18n="petWindow.greet">Sapa</button>
  <button class="btn" id="b-talk" data-i18n="petWindow.talk">Bicara</button>
  <button class="btn" id="b-through" hidden data-i18n="petWindow.ctOff">Klik tembus</button>
  <button class="btn" id="b-close" data-i18n="petWindow.close">Tutup</button>
</div>
<script src="js/live2dcubismcore.min.js"></script>
<script src="js/cubism-framework.js"></script>
<script src="js/live2d-adapter.js"></script>
<script src="js/scene-layers.js"></script>
<script src="js/pixi8-namespace.js"></script>
<script src="js/bundle.js"></script>
<!-- Core i18n (khusus pet — app utama memuatnya di dalam bundle.js). Self-exec:
     menyweep atribut data-i18n* di atas sekaligus membaca localStorage, jadi
     bahasa pet mengikuti bahasa app utama (origin sama). -->
<script src="js/i18n.js?v=1"></script>
<script>
(function () {
  const API = location.origin;
  const t = (k, v) => (window.__i18n ? window.__i18n.t(k, v) : k);
  const qs = new URLSearchParams(location.search);
  if (qs.get("renderer") === "legacy") {
    console.info("[pet] ?renderer=legacy parameter is retired in R9-3; using production Cubism renderer unconditionally.");
  }

  const state = {
    production: true,
    host: null,
    handle: null,
    model: null,
    roleLink: null,
    arbiter: null,
    bubbleTimer: null,
    idleTimer: null,
    rafId: null,
    swayTime: 0,
    activeModelPath: null,
  };

  function bubble(text, ms) {
    const b = document.getElementById("bubble");
    document.getElementById("bubble-text").textContent = text;
    b.style.display = "block";
    clearTimeout(state.bubbleTimer);
    state.bubbleTimer = setTimeout(() => (b.style.display = "none"), ms || 3500);
  }

  function createCompatModel(handle) {
    const nat = () => handle.getNaturalSize();
    const sz = () => ({ w: window.innerWidth, h: window.innerHeight });
    const rect = () => {
      const n = nat();
      const sc = handle.getScale();
      const pos = handle.getPosition();
      return { x: pos.x, y: pos.y, w: n.width * sc, h: n.height * sc };
    };
    return {
      __isCompatModel: true,
      get width() { return rect().w; },
      get height() { return rect().h; },
      get x() { return sz().w / 2 + rect().x; },
      set x(v) { handle.setPosition(v - sz().w / 2, handle.getPosition().y); },
      get y() { return sz().h / 2 + rect().y; },
      set y(v) { handle.setPosition(handle.getPosition().x, v - sz().h / 2); },
      get position() {
        return {
          get x() { return sz().w / 2 + rect().x; },
          set x(v) { handle.setPosition(v - sz().w / 2, handle.getPosition().y); },
          get y() { return sz().h / 2 + rect().y; },
          set y(v) { handle.setPosition(handle.getPosition().x, v - sz().h / 2); },
        };
      },
      get scale() {
        return {
          get x() { return handle.getScale(); },
          set x(v) { handle.setScale(v); },
          get y() { return handle.getScale(); },
          set y(v) { handle.setScale(v); },
          set(x) { handle.setScale(x); },
        };
      },
      set rotation(v) { handle.setRotation(v); },
      anchor: { set(x, y) { handle.setAnchor(x, y); } },
      motion(group, index, priority) {
        return Promise.resolve(
          handle.playNativeMotion(group, index === undefined ? -1 : index, priority || 2),
        );
      },
      expression(name) {
        return Promise.resolve(handle.playExpression(name));
      },
      destroy() { handle.destroy(); },
      getBounds() {
        const r = rect();
        const L = sz().w / 2 + r.x, T = sz().h / 2 + r.y;
        return {
          left: L, top: T, right: L + r.w, bottom: T + r.h,
          width: r.w, height: r.h,
          centerX: L + r.w / 2, centerY: T + r.h / 2,
        };
      },
      toGlobal(p) {
        const r = rect();
        const sc = handle.getScale();
        const L = sz().w / 2 + r.x, T = sz().h / 2 + r.y;
        return { x: L + p.x * sc, y: T + p.y * sc };
      },
      toLocal(p) {
        const r = rect();
        const sc = handle.getScale();
        const L = sz().w / 2 + r.x, T = sz().h / 2 + r.y;
        return { x: (p.x - L) / sc, y: (p.y - T) / sc };
      },
      texture: null,
    };
  }

  function frameModel() {
    const m = state.model;
    if (!m || !state.handle) return;
    const natW = state.handle.getNaturalSize().width;
    const natH = state.handle.getNaturalSize().height;
    if (!natW || !natH) return;
    const s = Math.min((window.innerWidth * 0.9) / natW, (window.innerHeight * 0.92) / natH);
    m.scale.set(s);
    m.x = (window.innerWidth - natW * s) / 2;
    m.y = (window.innerHeight - natH * s) / 2 - window.innerHeight * 0.03;
  }

  let lastTime = performance.now();
  function startRenderLoop() {
    if (state.rafId) cancelAnimationFrame(state.rafId);
    lastTime = performance.now();
    const tick = (now) => {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      if (state.handle) {
        state.swayTime += dt;
        state.handle.setRotation(Math.sin(state.swayTime * 0.9) * 0.012);
        state.handle.update(dt);
        if (state.host) state.host.render();
      }
      state.rafId = requestAnimationFrame(tick);
    };
    state.rafId = requestAnimationFrame(tick);
  }

  async function teardownCurrentModel() {
    if (state.handle) {
      if (state.host) {
        try { state.host.remove(state.handle); } catch (e) {}
      }
      try { state.handle.destroy(); } catch (e) {}
      state.handle = null;
    }
    state.model = null;
    state.roleLink = null;
    state.arbiter = null;
    state.activeModelPath = null;
  }

  async function teardown() {
    if (state.rafId) {
      cancelAnimationFrame(state.rafId);
      state.rafId = null;
    }
    if (state.idleTimer) {
      clearInterval(state.idleTimer);
      state.idleTimer = null;
    }
    if (state.bubbleTimer) {
      clearTimeout(state.bubbleTimer);
      state.bubbleTimer = null;
    }
    await teardownCurrentModel();
    if (state.host) {
      try { state.host.destroy(); } catch (e) {}
      state.host = null;
    }
  }

  async function loadModel(path) {
    if (!path) {
      document.getElementById("status").textContent = t("petWindow.noModel");
      return;
    }
    document.getElementById("status").textContent = t("petWindow.loadingModel");
    await teardownCurrentModel();

    await window.__compositor8Ready;
    let stageCanvas = document.getElementById("live2d-canvas");
    if (!stageCanvas) {
      stageCanvas = document.createElement("canvas");
      stageCanvas.id = "live2d-canvas";
      const stageEl = document.getElementById("stage") || document.body;
      stageEl.appendChild(stageCanvas);
    }
    const W = window.innerWidth, H = window.innerHeight;
    stageCanvas.style.width = W + "px";
    stageCanvas.style.height = H + "px";
    stageCanvas.style.position = "absolute";
    stageCanvas.style.inset = "0";

    if (!state.host) {
      state.host = window.__live2dApi.createHost({
        canvas: stageCanvas,
        width: W,
        height: H,
        backgroundAlpha: 0,
        resolution: Math.min(window.devicePixelRatio || 1, 2),
        composite: "canvas-texture",
      });
    } else {
      state.host.resize(W, H);
    }

    const handle = await window.__live2dApi.loadModel(state.host, { kind: "path", path });
    state.handle = handle;
    handle.setAnchor(0, 0); // konvensi posisi: origin sudut kiri-atas
    state.host.add(handle);
    const model = createCompatModel(handle);
    state.model = model;
    state.activeModelPath = path;

    // Wire roleLink Phase 10 di atas handle
    if (window.__engineRoleLink && window.__roleMapping) {
      try {
        state.roleLink = window.__engineRoleLink.attachHandle(handle, () => {
          const allParams = handle.getParameters().map((p) => p.id);
          const blinkIds = handle.getEyeBlinkParameters();
          const lipIds = handle.getLipSyncParameters();
          return window.__roleMapping.mapRoles(new Set(allParams), {
            eyeBlinkIds: blinkIds,
            lipSyncIds: lipIds,
          });
        });
      } catch (e) {
        console.warn("[pet] roleLink attach failed:", e);
      }
    }

    // Wire ParameterArbiter Phase 13
    if (window.__l2dArbiter) {
      try {
        state.arbiter = window.__l2dArbiter.createArbiter({
          writeRole: (role, v) => (state.roleLink ? !!state.roleLink.bridge.writeRef(role, v) : false),
          writeRoleNorm: (role, t) => (state.roleLink ? !!state.roleLink.bridge.writeNorm(role, t) : false),
          writeParam: (id, v) => (state.roleLink ? !!state.roleLink.writeActual(id, v) : false),
        });
      } catch (e) {
        console.warn("[pet] arbiter init failed:", e);
      }
    }

    handle.onBeforeModelUpdate(() => {
      if (state.arbiter) state.arbiter.commit();
    });

    frameModel();
    startRenderLoop();

    document.getElementById("status").textContent = t("petWindow.active");
    startIdleLife();
  }

  async function resolveDefaultModelPath() {
    let path = qs.get("model");
    if (path) return path;
    try {
      const r = await fetch(API + "/api/models");
      const d = await r.json();
      const first = (d.models || [])[0];
      if (first) {
        const rp = await fetch(API + "/api/model/path?name=" + encodeURIComponent(first));
        const dp = await rp.json();
        return dp.path || null;
      }
    } catch (e) {}
    return null;
  }

  async function boot() {
    const path = await resolveDefaultModelPath();
    await loadModel(path);
  }

  function startIdleLife() {
    if (state.idleTimer) clearInterval(state.idleTimer);

    const lines = [
      t("petWindow.idle1"), t("petWindow.idle2"),
      t("petWindow.idle3"), t("petWindow.idle4"),
      t("petWindow.idle5"), t("petWindow.idle6"),
    ];
    state.idleTimer = setInterval(() => {
      if (Math.random() < 0.5) bubble(lines[Math.floor(Math.random() * lines.length)]);
    }, 90000);
  }

  // Interaksi kursor (tatapan / eye-tracking)
  window.addEventListener("mousemove", (e) => {
    const rect = { w: window.innerWidth, h: window.innerHeight };
    const nx = (e.clientX / rect.w) * 2 - 1;
    const ny = (e.clientY / rect.h) * 2 - 1;

    if (state.production && state.arbiter) {
      state.arbiter.submit({
        channel: "mouseGaze",
        priority: 10,
        domain: "role",
        values: {
          angleX: nx * 18,
          angleY: -ny * 14,
          eyeBallX: nx,
          eyeBallY: -ny,
        },
      });
    }
  });

  // Penanganan resize & perubahan DPR
  window.addEventListener("resize", () => {
    const W = window.innerWidth;
    const H = window.innerHeight;
    const stageCanvas = document.getElementById("live2d-canvas");
    if (stageCanvas) {
      stageCanvas.style.width = W + "px";
      stageCanvas.style.height = H + "px";
    }
    if (state.host) {
      state.host.resize(W, H);
      frameModel();
    }
  });

  function motionOrExpression(kind) {
    if (!state.handle) return;
    try {
      if (kind === "wave") {
        const groups = state.handle.motionGroups();
        if (groups.includes("TapBody")) {
          state.handle.playNativeMotion("TapBody", -1, 3);
        } else if (groups.length > 0) {
          const pick = groups.find((g) => g !== "Idle" && g !== "idle") || groups[0];
          state.handle.playNativeMotion(pick, -1, 3);
        }
      }
    } catch (e) {
      console.warn("[pet] motion error:", e);
    }
  }

  document.getElementById("b-wave").addEventListener("click", () => {
    motionOrExpression("wave");
    bubble(t("petWindow.waveBack"));
  });
  document.getElementById("b-talk").addEventListener("click", () => {
    const lines = [t("petWindow.talk1"), t("petWindow.talk2"), t("petWindow.talk3")];
    bubble(lines[Math.floor(Math.random() * lines.length)]);
  });

  // ── Integrasi cangkang Tauri (window transparan + klik-tembus) ──────
  const inTauri = () => typeof window.__TAURI__ !== "undefined";
  const tauriWin = () => inTauri() ? window.__TAURI__.window.getCurrentWindow() : null;

  async function applyClickThrough(on) {
    const w = tauriWin();
    if (w) { try { await w.setIgnoreCursorEvents(on); } catch (e) {} }
    const b = document.getElementById("b-through");
    if (b) {
      b.classList.toggle("active", on);
      b.textContent = on ? t("petWindow.ctOn") : t("petWindow.ctOff");
    }
  }

  const bThrough = document.getElementById("b-through");
  if (bThrough) {
    bThrough.addEventListener("click", async () => {
      try {
        const r = await fetch(API + "/api/pet/clickthrough", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ on: !bThrough.classList.contains("active") }),
        });
        const d = await r.json();
        applyClickThrough(!!d.clickThrough);
      } catch (e) {}
    });
    if (!inTauri()) bThrough.hidden = true;
  }

  setInterval(async () => {
    if (!inTauri()) return;
    try {
      const r = await fetch(API + "/api/pet/state");
      const st = await r.json();
      applyClickThrough(!!st.clickThrough);
    } catch (e) {}
  }, 1500);

  document.getElementById("b-close").addEventListener("click", async () => {
    await teardown();
    try { await fetch(API + "/api/pet/close", { method: "POST" }); } catch (e) {}
    const w = tauriWin();
    if (w) { try { await w.destroy(); } catch (e) {} }
    window.close();
  });

  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") document.getElementById("b-close").click();
  });

  // Ekspos state untuk kebutuhan pengujian harness/smoke
  window.__petState = state;
  window.__petLoadModel = loadModel;
  window.__petTeardown = teardown;
  window.__petFrameModel = frameModel;

  boot().catch((e) => {
    document.getElementById("status").textContent = t("sys.errGeneric", { msg: e.message });
  });
})();
</script>
</body>
</html>
