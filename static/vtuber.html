<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>VTuber Overlay — Live2D Agent</title>
<style>
  /* Overlay OBS Browser Source: body transparan (alpha WebGL), karakter
     dikomposit OBS di atas sumber lain. Palet sama dengan app utama
     (static/css/app.css): warna solid, tanpa blur/gradient. */
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; height: 100%; }
  #stage { position: fixed; inset: 0; background: transparent; }
  #live2d-canvas { position: absolute; top: 0; left: 0; }
  #status {
    position: fixed; top: 6px; left: 8px;
    font: 10px ui-monospace, Consolas, monospace; color: #66707F;
  }
  #bubble {
    position: fixed; bottom: 42px; left: 50%; transform: translateX(-50%);
    max-width: 380px; background: #12151C; color: #EDF0F4;
    border: 1px solid #333B4B; border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.48);
    padding: 9px 14px; display: none;
    font: 13px/1.55 "Segoe UI", -apple-system, system-ui, sans-serif;
  }
  #alert {
    position: fixed; top: 34px; left: 50%; transform: translateX(-50%);
    background: #2A1618; color: #F2B8B5; border: 1px solid #5C2A2A;
    border-radius: 8px; padding: 8px 16px; display: none;
    font: 13px/1.4 "Segoe UI", -apple-system, system-ui, sans-serif;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.48);
  }
  /* HUD hanya muncul dengan ?hud=1 (dibuka dari app utama). URL tanpa ?hud=1
     dipakai di OBS Browser Source → tampilan murni karakter saja. */
  #hud {
    position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
    display: none; gap: 10px; align-items: center; padding: 5px 10px;
    border-radius: 6px; background: #12151C; border: 1px solid #232936;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.42);
    font: 12px "Segoe UI", -apple-system, system-ui, sans-serif; color: #9BA5B4;
  }
  #hud.visible { display: flex; }
  #hud .btn {
    border: 1px solid transparent; background: none; color: #9BA5B4;
    border-radius: 4px; padding: 4px 9px; cursor: pointer;
    font: 12px "Segoe UI", -apple-system, system-ui, sans-serif;
  }
  #hud .btn:hover { background: #212734; border-color: #333B4B; color: #EDF0F4; }
  #hud input[type="text"] { width: 170px; }
  #hud input[type="number"] { width: 44px; }
  #hud input {
    background: #0D0D10; color: #EDF0F4; border: 1px solid #232936;
    border-radius: 4px; padding: 3px 6px; font: 12px "Segoe UI", system-ui, sans-serif;
  }
  #hud label { display: flex; gap: 5px; align-items: center; white-space: nowrap; }
</style>
</head>
<body>
<div id="stage"><canvas id="live2d-canvas"></canvas></div>
<div id="status">overlay</div>
<div id="bubble"><span id="bubble-text"></span></div>
<div id="alert"></div>
<div id="hud">
  <label><input id="ov-respond" type="checkbox" checked /> <span data-i18n="vtOv.respond">Balas otomatis</span></label>
  <label><span data-i18n="vt.persona">Gaya jawab</span> <input id="ov-persona" type="text" /></label>
  <label><span data-i18n="vt.cooldown">Jeda antar balas (dtk)</span> <input id="ov-cooldown" type="number" min="5" max="120" value="12" /></label>
  <button class="btn" id="ov-copy" data-i18n="vtOv.copyUrl">Salin URL OBS</button>
</div>
<script src="js/live2dcubismcore.min.js"></script>
<script src="js/cubism-framework.js"></script>
<script src="js/live2d-adapter.js"></script>
<script src="js/scene-layers.js"></script>
<script src="js/pixi8-namespace.js"></script>
<!-- bundle.js = core TS utuh: window.__i18n, window.LipSync, window.__live2dApi,
     window.__engineRoleLink, window.__l2dArbiter, motion, dll. -->
<script src="js/bundle.js"></script>
<script>
(function () {
  const API = location.origin;
  const t = (k, v) => (window.__i18n ? window.__i18n.t(k, v) : k);
  const qs = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);
  if (qs.get("renderer") === "legacy") {
    console.info("[vtuber] ?renderer=legacy parameter is retired in R9-3; using production Cubism renderer unconditionally.");
  }

  const state = {
    production: true,
    host: null,
    handle: null,
    model: null,
    roleLink: null,
    arbiter: null,
    audioLipSync: null,
    lipPulseActive: false,
    lipPulseTime: 0,
    swayTime: 0,
    rafId: null,
    activeModelPath: null,
    bubbleTimer: null,
    alertTimer: null,
    heartbeatTimer: null,
    eventsTimer: null,
    dir: 1,
  };

  function setStatus(msg) { $("status").textContent = "overlay — " + msg; }
  function bubble(text, ms) {
    const b = $("bubble");
    $("bubble-text").textContent = text;
    b.style.display = "block";
    clearTimeout(state.bubbleTimer);
    state.bubbleTimer = setTimeout(() => (b.style.display = "none"), ms || 4500);
  }
  function donationAlert(user, amount) {
    const a = $("alert");
    a.textContent = t("vtOv.alert", { user, amount: amount || "" });
    a.style.display = "block";
    clearTimeout(state.alertTimer);
    state.alertTimer = setTimeout(() => (a.style.display = "none"), 6000);
  }

  // ── HUD (?hud=1 saja) — preferensi disimpan lokal per browser ────────────
  function hudInit() {
    if (!qs.has("hud")) return;
    $("hud").classList.add("visible");
    const saved = lsGet();
    $("ov-respond").checked = saved.respond !== false;
    $("ov-persona").value = saved.persona || "";
    if (saved.cooldown) $("ov-cooldown").value = saved.cooldown;
    for (const id of ["ov-respond", "ov-persona", "ov-cooldown"])
      $(id).addEventListener("change", lsSave);
    $("ov-copy").addEventListener("click", () => {
      const clean = location.origin + "/vtuber.html";
      navigator.clipboard && navigator.clipboard.writeText(clean).then(
        () => { $("ov-copy").textContent = t("vtOv.copied"); },
        () => {},
      );
    });
  }
  function lsGet() {
    try { return JSON.parse(localStorage.getItem("vtuber_overlay") || "{}"); }
    catch (e) { return {}; }
  }
  function lsSave() {
    try {
      localStorage.setItem("vtuber_overlay", JSON.stringify({
        respond: $("ov-respond").checked,
        persona: $("ov-persona").value.trim(),
        cooldown: Number($("ov-cooldown").value) || 12,
      }));
    } catch (e) {}
  }
  const respondOn = () => { const s = lsGet(); return s.respond !== false; };
  const personaText = () => { const s = lsGet(); return s.persona || "ceria dan ramah"; };
  const cooldownMs = () => Math.max(5, (lsGet().cooldown || 12)) * 1000;

  // ── Compat Model Facade untuk kode VTuber (paritas koordinat POJO murni) ──
  function createCompatModel(handle) {
    const nat = () => handle.getNaturalSize();
    const sz = () => ({ w: window.innerWidth, h: window.innerHeight });
    const rect = () => {
      const n = nat();
      const sc = handle.getScale();
      const pos = handle.getPosition();
      return { x: pos.x, y: pos.y, w: n.width * sc, h: n.height * sc };
    };
    return {
      __isCompatModel: true,
      get handle() { return handle; },
      get width() { return rect().w; },
      get height() { return rect().h; },
      get x() { return sz().w / 2 + rect().x; },
      set x(v) { handle.setPosition(v - sz().w / 2, handle.getPosition().y); },
      get y() { return sz().h / 2 + rect().y; },
      set y(v) { handle.setPosition(handle.getPosition().x, v - sz().h / 2); },
      get position() {
        return {
          get x() { return sz().w / 2 + rect().x; },
          set x(v) { handle.setPosition(v - sz().w / 2, handle.getPosition().y); },
          get y() { return sz().h / 2 + rect().y; },
          set y(v) { handle.setPosition(handle.getPosition().x, v - sz().h / 2); },
        };
      },
      get scale() {
        return {
          get x() { return handle.getScale(); },
          set x(v) { handle.setScale(v); },
          get y() { return handle.getScale(); },
          set y(v) { handle.setScale(v); },
          set(x) { handle.setScale(x); },
        };
      },
      set rotation(v) { handle.setRotation(v); },
      anchor: { set(x, y) { handle.setAnchor(x, y); } },
      motion(group, index, priority) {
        return Promise.resolve(
          handle.playNativeMotion(group, index === undefined ? -1 : index, priority || 2),
        );
      },
      expression(name) {
        return Promise.resolve(handle.playExpression(name));
      },
      destroy() { handle.destroy(); },
      getBounds() {
        const r = rect();
        const L = sz().w / 2 + r.x, T = sz().h / 2 + r.y;
        return {
          left: L, top: T, right: L + r.w, bottom: T + r.h,
          width: r.w, height: r.h,
          centerX: L + r.w / 2, centerY: T + r.h / 2,
        };
      },
      toGlobal(p) {
        const r = rect();
        const sc = handle.getScale();
        const L = sz().w / 2 + r.x, T = sz().h / 2 + r.y;
        return { x: L + p.x * sc, y: T + p.y * sc };
      },
      toLocal(p) {
        const r = rect();
        const sc = handle.getScale();
        const L = sz().w / 2 + r.x, T = sz().h / 2 + r.y;
        return { x: (p.x - L) / sc, y: (p.y - T) / sc };
      },
      texture: null,
    };
  }

  // ── Framing model (paritas formula subpixel identik dengan pet.html) ───────
  function frameModel() {
    const m = state.model;
    if (!m || !state.handle) return;
    const natW = state.handle.getNaturalSize().width;
    const natH = state.handle.getNaturalSize().height;
    if (!natW || !natH) return;
    const s = Math.min((window.innerWidth * 0.9) / natW, (window.innerHeight * 0.92) / natH);
    m.scale.set(s);
    m.x = (window.innerWidth - natW * s) / 2;
    m.y = (window.innerHeight - natH * s) / 2 - window.innerHeight * 0.03;
  }

  // ── Render Loop Tunggal (requestAnimationFrame eksplisit) ───────────────────
  let lastTime = performance.now();
  function startRenderLoop() {
    if (state.rafId) cancelAnimationFrame(state.rafId);
    lastTime = performance.now();
    const tick = (now) => {
      const dt = lastTime ? Math.max(0, Math.min(0.05, (now - lastTime) / 1000)) : 0.016;
      lastTime = now;
      if (state.handle) {
        // 1. Idle sway halus (rotasi sinusoide)
        state.swayTime += dt;
        state.handle.setRotation(Math.sin(state.swayTime * 0.9) * 0.012);

        // 2. Lip-sync intent (browser TTS pulse atau remote AudioLipSync analyser)
        if (state.arbiter) {
          if (state.lipPulseActive) {
            state.lipPulseTime += dt;
            const val = 0.25 + Math.abs(Math.sin(state.lipPulseTime * 5.2)) * 0.55;
            state.arbiter.submit({
              channel: "lipSync",
              priority: 15,
              domain: "role",
              values: { mouthOpenY: val },
            });
          } else if (state.audioLipSync && state.audioLipSync.active) {
            const open = state.audioLipSync.sample(now);
            state.arbiter.submit({
              channel: "lipSync",
              priority: 15,
              domain: "role",
              values: { mouthOpenY: open },
            });
          } else {
            state.arbiter.submit({
              channel: "lipSync",
              priority: 15,
              domain: "role",
              values: { mouthOpenY: 0 },
            });
          }
        }

        // 3. Exactly one model update (memicu onBeforeModelUpdate -> arbiter commit)
        state.handle.update(dt);

        // 4. Exactly one host render
        if (state.host) state.host.render();
      }
      state.rafId = requestAnimationFrame(tick);
    };
    state.rafId = requestAnimationFrame(tick);
  }

  // ── Pembersihan & Siklus Hidup Model ───────────────────────────────────────
  async function teardownCurrentModel() {
    if (state.handle) {
      if (state.host) {
        try { state.host.remove(state.handle); } catch (e) {}
      }
      try { state.handle.destroy(); } catch (e) {}
      state.handle = null;
    }
    state.model = null;
    state.roleLink = null;
    state.arbiter = null;
    state.activeModelPath = null;
  }

  async function teardown() {
    if (state.rafId) {
      cancelAnimationFrame(state.rafId);
      state.rafId = null;
    }
    if (state.bubbleTimer) {
      clearTimeout(state.bubbleTimer);
      state.bubbleTimer = null;
    }
    if (state.alertTimer) {
      clearTimeout(state.alertTimer);
      state.alertTimer = null;
    }
    if (state.heartbeatTimer) {
      clearInterval(state.heartbeatTimer);
      state.heartbeatTimer = null;
    }
    if (state.eventsTimer) {
      clearInterval(state.eventsTimer);
      state.eventsTimer = null;
    }
    pollingStarted = false;
    await teardownCurrentModel();
    if (state.host) {
      try { state.host.destroy(); } catch (e) {}
      state.host = null;
    }
  }

  // ── Muat model ─────────────────────────────────────────────────────────────
  async function resolveModelPath() {
    let path = qs.get("model");
    if (path) return path;
    try {
      const r = await fetch(API + "/api/models");
      const d = await r.json();
      const first = (d.models || [])[0];
      if (!first) return "";
      const rp = await fetch(API + "/api/model/path?name=" + encodeURIComponent(first));
      const dp = await rp.json();
      return dp.path || "";
    } catch (e) { return ""; }
  }

  async function loadModel(path) {
    if (!path) {
      setStatus(t("vtOv.noModel"));
      return;
    }
    setStatus(t("vtOv.loadingModel"));
    await teardownCurrentModel();

    await window.__compositor8Ready;
    let stageCanvas = document.getElementById("live2d-canvas");
    if (!stageCanvas) {
      stageCanvas = document.createElement("canvas");
      stageCanvas.id = "live2d-canvas";
      const stageEl = document.getElementById("stage") || document.body;
      stageEl.appendChild(stageCanvas);
    }
    const W = window.innerWidth, H = window.innerHeight;
    stageCanvas.style.width = W + "px";
    stageCanvas.style.height = H + "px";
    stageCanvas.style.position = "absolute";
    stageCanvas.style.inset = "0";

    if (!state.host) {
      state.host = window.__live2dApi.createHost({
        canvas: stageCanvas,
        width: W,
        height: H,
        backgroundAlpha: 0,
        resolution: Math.min(window.devicePixelRatio || 1, 2),
        composite: "canvas-texture",
      });
    } else {
      state.host.resize(W, H);
    }

    const handle = await window.__live2dApi.loadModel(state.host, { kind: "path", path });
    state.handle = handle;
    handle.setAnchor(0, 0); // konvensi posisi: origin sudut kiri-atas
    state.host.add(handle);
    const model = createCompatModel(handle);
    state.model = model;
    state.activeModelPath = path;

    // Wire roleLink Phase 10 di atas handle
    if (window.__engineRoleLink && window.__roleMapping) {
      try {
        state.roleLink = window.__engineRoleLink.attachHandle(handle, () => {
          const allParams = handle.getParameters().map((p) => p.id);
          const blinkIds = handle.getEyeBlinkParameters();
          const lipIds = handle.getLipSyncParameters();
          return window.__roleMapping.mapRoles(new Set(allParams), {
            eyeBlinkIds: blinkIds,
            lipSyncIds: lipIds,
          });
        });
      } catch (e) {
        console.warn("[vtuber] roleLink attach failed:", e);
      }
    }

    // Wire ParameterArbiter Phase 13
    if (window.__l2dArbiter) {
      try {
        state.arbiter = window.__l2dArbiter.createArbiter({
          writeRole: (role, v) => (state.roleLink ? !!state.roleLink.bridge.writeRef(role, v) : false),
          writeRoleNorm: (role, t) => (state.roleLink ? !!state.roleLink.bridge.writeNorm(role, t) : false),
          writeParam: (id, v) => (state.roleLink ? !!state.roleLink.writeActual(id, v) : false),
        });
      } catch (e) {
        console.warn("[vtuber] arbiter init failed:", e);
      }
    }

    handle.onBeforeModelUpdate(() => {
      if (state.arbiter) state.arbiter.commit();
    });

    frameModel();
    startRenderLoop();

    loadVoiceCfg(path);
    startIdleLife();
    startPolling();
    setStatus(t("vtOv.idle"));
  }

  async function boot() {
    const path = await resolveModelPath();
    await loadModel(path);
  }

  function startIdleLife() {}

  // ── Penanganan Resize & DPR ────────────────────────────────────────────────
  window.addEventListener("resize", () => {
    const W = window.innerWidth;
    const H = window.innerHeight;
    const stageCanvas = document.getElementById("live2d-canvas");
    if (stageCanvas) {
      stageCanvas.style.width = W + "px";
      stageCanvas.style.height = H + "px";
    }
    if (state.host) {
      state.host.resize(W, H);
      frameModel();
    }
  });

  // ── Param suara (sheet model = sumber sama dengan app utama) ─────────────
  const VOICE = { lang: "id-ID", rate: 1, pitch: 1.15, voiceName: "" };
  async function loadVoiceCfg(modelPath) {
    try {
      const key = String(modelPath).replace(/[^A-Za-z0-9_\u4e00-\u9fff]/g, "_");
      const r = await fetch(API + "/api/sheet?name=" + encodeURIComponent(key));
      if (r.ok) {
        const sheet = await r.json();
        const c = (sheet && sheet.config) || {};
        if (c.ttsLang) VOICE.lang = c.ttsLang;
        if (c.ttsRate) VOICE.rate = Number(c.ttsRate) || 1;
        if (c.ttsPitch) VOICE.pitch = Number(c.ttsPitch) || 1.15;
        if (c.ttsVoiceName) VOICE.voiceName = c.ttsVoiceName;
      }
    } catch (e) {}
  }

  // ── TTS: provider mengikuti /api/config (browser / remote) ───────────────
  let TTS_PROVIDER = "browser";
  async function loadTTSProvider() {
    try {
      const d = await fetch(API + "/api/config").then((r) => r.json());
      TTS_PROVIDER = (d.tts && d.tts.provider) || "browser";
    } catch (e) {}
  }

  // Pecah kalimat — batas . ! ? …
  function splitSegments(text) {
    const parts = String(text || "").trim().split(/(?<=[.!?…]["”»')\]]?)\s+/);
    return parts.map((p) => p.trim()).filter(Boolean);
  }

  // Gerakkan bibir saat browser TTS (yang tak punya data audio analisis):
  // Menggunakan flag lipPulseActive yang disampel oleh RAF loop via ParameterArbiter.
  function mouthPulse() {
    state.lipPulseActive = true;
    state.lipPulseTime = 0;
    return () => {
      state.lipPulseActive = false;
      state.lipPulseTime = 0;
      if (state.arbiter) {
        state.arbiter.submit({
          channel: "lipSync",
          priority: 15,
          domain: "role",
          values: { mouthOpenY: 0 },
        });
      }
    };
  }

  function speakBrowser(text) {
    return new Promise((resolve) => {
      let done = false;
      const finish = () => { if (!done) { done = true; stopMouth(); resolve(); } };
      const stopMouth = mouthPulse();
      try {
        if (typeof speechSynthesis === "undefined") return finish();
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = VOICE.lang; u.rate = VOICE.rate; u.pitch = VOICE.pitch; u.volume = 1;
        u.onend = finish; u.onerror = finish;
        const pickVoice = () => {
          const vs = speechSynthesis.getVoices() || [];
          const base = String(VOICE.lang || "").split("-")[0].toLowerCase();
          const langRe = new RegExp("^" + base, "i");
          const v =
            (VOICE.voiceName ? vs.find((x) => x.name === VOICE.voiceName) : null) ||
            vs.find((x) => String(x.lang).toLowerCase() === String(VOICE.lang).toLowerCase()) ||
            vs.find((x) => langRe.test(x.lang)) ||
            (base === "id" ? vs.find((x) => /indonesia/i.test(x.name)) : null);
          if (v) u.voice = v;
          speechSynthesis.speak(u);
        };
        if (speechSynthesis.getVoices().length) pickVoice();
        else speechSynthesis.addEventListener("voiceschanged", pickVoice, { once: true });
        setTimeout(finish, 20000 + text.length * 120);
      } catch (e) { finish(); }
    });
  }

  function speakRemote(text) {
    return new Promise((resolve, reject) => {
      let done = false;
      const finish = () => {
        if (!done) {
          done = true;
          if (state.arbiter) {
            state.arbiter.submit({
              channel: "lipSync",
              priority: 15,
              domain: "role",
              values: { mouthOpenY: 0 },
            });
          }
          resolve();
        }
      };
      fetch(API + "/api/tts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      }).then(async (r) => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        const blob = await r.blob();
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        audio.playbackRate = Math.min(2, Math.max(0.5, VOICE.rate));
        if (window.LipSync && window.LipSync.AudioLipSync) {
          state.audioLipSync = state.audioLipSync || new window.LipSync.AudioLipSync();
          state.audioLipSync.reset();
          if (!state.audioLipSync.attach(audio)) state.audioLipSync = null;
        }
        audio.onended = () => { URL.revokeObjectURL(url); finish(); };
        audio.onerror = () => { URL.revokeObjectURL(url); finish(); };
        audio.play().catch(() => { URL.revokeObjectURL(url); finish(); });
        setTimeout(finish, 60000);
      }).catch(reject);
    });
  }

  let speaking = false;
  async function speak(text) {
    if (speaking || !text) return;
    speaking = true;
    try {
      for (const seg of splitSegments(text)) {
        bubble(seg);
        if (TTS_PROVIDER === "browser") await speakBrowser(seg);
        else {
          try { await speakRemote(seg); }
          catch (e) { console.warn("[overlay] TTS remote gagal, fallback browser:", e.message); await speakBrowser(seg); }
        }
      }
    } finally { speaking = false; }
  }

  // ── Runtime vtuber: poll event + balas ───────────────────────────────────
  let cursor = 0;
  let lastReplyAt = 0;

  async function askLLM(prompt, persona) {
    const r = await fetch(API + "/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: [{ role: "user", content: prompt }],
        system: "Kamu adalah VTuber Live2D yang sedang streaming. Gaya bicara: " + persona + ". Jawab HANYA kalimat yang akan diucapkan, tanpa awalan nama.",
      }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || d.error) throw new Error(d.error || "LLM error");
    return d.reply || "";
  }

  function logAgentEvent(text) {
    fetch(API + "/api/vtuber/mock-event", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type: "agent", user: "AI", text }),
    }).catch(() => {});
  }

  async function maybeRespond(ev) {
    if (!respondOn()) return;
    if (Date.now() - lastReplyAt < cooldownMs()) return;
    lastReplyAt = Date.now();
    const isDono = ev.type === "donation";
    const prompt = isDono
      ? t("vt.donatePrompt", { user: ev.user, amount: ev.amount || "", text: ev.text })
      : t("vt.chatPrompt", { user: ev.user, text: ev.text });
    try {
      const reply = await askLLM(prompt, personaText());
      if (reply) { logAgentEvent(reply); speak(reply); }
    } catch (e) {
      setStatus(t("vt.aiFail", { msg: e.message }));
    }
  }

  let pollingStarted = false;
  async function startPolling() {
    loadTTSProvider();
    if (pollingStarted) return;
    pollingStarted = true;
    state.heartbeatTimer = setInterval(() => {
      fetch(API + "/api/vtuber/overlay", { method: "POST" }).catch(() => {});
    }, 3000);
    state.eventsTimer = setInterval(async () => {
      try {
        const r = await fetch(API + "/api/vtuber/events?since=" + cursor);
        const d = await r.json();
        cursor = d.cursor || cursor;
        for (const ev of d.events || []) {
          if (ev.type === "donation") donationAlert(ev.user, ev.amount);
          if (ev.type === "chat" || ev.type === "donation") maybeRespond(ev);
        }
      } catch (e) {}
    }, 2000);
  }

  hudInit();

  // ── Future Capability & Test Harness Seams ────────────────────────────────
  window.__vtuberState = state;
  window.__vtuberLoadModel = loadModel;
  window.__vtuberTeardown = teardown;
  window.__vtuberFrameModel = frameModel;
  window.__vtuberPlayMotion = (group, no, priority) => {
    return state.handle ? state.handle.playNativeMotion(group, no ?? -1, priority ?? 2) : null;
  };
  window.__vtuberPlayExpression = (name) => {
    return state.handle ? state.handle.playExpression(name) : null;
  };
  window.__vtuberSubmitRole = (role, val, priority = 10, channel = "user") => {
    return state.arbiter?.submit({ channel, priority, domain: "role", values: { [role]: val } });
  };

  boot().catch((e) => setStatus(t("sys.errGeneric", { msg: e.message })));
})();
</script>
</body>
</html>
