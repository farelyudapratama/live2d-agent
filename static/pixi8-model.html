<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Test — ren (moc v6) · model3.json → Cubism Core → PixiJS 8 → canvas</title>
<style>
  html, body { margin: 0; height: 100%; background: #16120c; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }
  #report {
    position: fixed; top: 12px; left: 12px; z-index: 2;
    padding: 10px 14px; border-radius: 8px; max-width: 560px;
    background: rgba(0,0,0,.82); border: 1px solid #3a332a;
    color: #e8e0d5; font: 12.5px/1.55 ui-monospace, Consolas, monospace;
    white-space: pre-wrap;
  }
  #report.ok   { border-color: #2e8b57; }
  #report.warn { border-color: #b08a3a; }
  #report.fail { border-color: #b03a3a; color: #ffb3b3; }
</style>
<!-- Core Cubism di head (sebelum dipakai) — pola sama dengan index.html. -->
<script src="js/live2dcubismcore.min.js"></script>
<script src="js/pixi.8.20.1.min.js"></script>
</head>
<body>
<div id="stage"></div>
<div id="report">booting…</div>
<script>
(async function () {
  "use strict";
  // ── Golden test model: ren (moc v6 / Cubism 5.3) ──
  // Dipilih DATA-DRIVEN dari probe core: satu-satunya model dengan fitur 5.3
  // lengkap — 24 offscreen (opacity grup 0.6/0.3/0.5/0), blend color
  // Multiply(6)/Color(17)/AddGlow(4)/HardLight(14), alpha Over+Atop+Out.
  // Lumine (v5, 35 mask) & 神宫白子 (v4, 43 mask) = pembanding pipeline lama.
  const GOLDEN = "model/tesmodel/runtime/ren.model3.json";
  // Mode offscreen (Cubism 5.3):
  //   composite (default) — drawable part offscreen dirender ke RenderTexture
  //     masing-masing lalu DIKOMPOSIT ke main sesuai opacity grup & posisi di
  //     render order gabungan (semantik renderer resmi);
  //   draw  — langsung ke main framebuffer (salah semantik, untuk perbandingan);
  //   hide  — disembunyikan (bagian hilang).
  const OFFSCREEN_MODE = (function () {
    const v = new URLSearchParams(location.search).get("offscreen");
    return v === "draw" || v === "hide" ? v : "composite";
  })();

  const el = document.getElementById("report");
  const lines = [];
  let reportClass = "";
  function log(msg, cls) {
    lines.push(msg);
    el.textContent = lines.join("\n");
    if (cls) reportClass = cls;
    el.className = reportClass;
    console.log("[golden]", msg);
  }
  const warnings = [];
  const warn = (m) => { warnings.push(m); log("⚠ " + m); };

  try {
    // ── 0. Core siap? (emscripten init async — poll, JANGAN set globalThis.window
    // di Node-style env; di browser ini aman karena window memang ada) ──
    const C = window.Live2DCubismCore;
    if (!C) throw new Error("live2dcubismcore.min.js tidak termuat");
    for (let i = 0; i < 200; i++) {
      try { if (C.Version.csmGetVersion()) break; } catch (e) {}
      await new Promise((r) => setTimeout(r, 50));
    }
    const coreVersion = C.Version.csmGetVersion();
    const latestMoc = C.Version.csmGetLatestMocVersion();
    // Packing versi core: (major<<24)|(minor<<16)|patch — 6.0.1 = 0x06000001.
    const coreStr = (coreVersion >>> 24) + "." + ((coreVersion >>> 16) & 0xff) + "." + (coreVersion & 0xff);
    log("Cubism Core " + coreStr + " — moc tertinggi: " + latestMoc);

    // ── 1. PixiJS 8 boot ──
    const app = new PIXI.Application();
    await app.init({
      width: window.innerWidth, height: window.innerHeight,
      background: "#16120c", antialias: true, autoDensity: true,
      resolution: Math.min(window.devicePixelRatio || 1, 2),
    });
    document.getElementById("stage").appendChild(app.canvas);

    // ── 2. model3.json → path relatif ──
    const manifestUrl = location.origin + "/" + GOLDEN;
    const manifest = await (await fetch(manifestUrl)).json();
    const mdir = manifestUrl.replace(/[^/]*$/, "");
    const rel = (p) => mdir + p.split("\\").join("/");
    log("manifest: " + GOLDEN);

    // ── 3. .moc3 → Cubism Core (fail-loud; TANPA stamp versi) ──
    const mocBytes = await (await fetch(rel(manifest.FileReferences.Moc))).arrayBuffer();
    const headerV = new DataView(mocBytes).getInt32(4, true);
    const moc = C.Moc.fromArrayBuffer(mocBytes);
    if (!moc) {
      throw new Error("core menolak moc v" + headerV +
        " (core dukung s/d v" + latestMoc + ") — update core, JANGAN stamp");
    }
    const model = C.Model.fromMoc(moc);
    const d = model.drawables, parts = model.parts, offs = model.offscreens || null;
    log("moc v" + headerV + " → model OK: " + d.count + " drawable, " +
        parts.count + " part, " + model.parameters.count + " param");

    // ── 4.5 PHASE 6A: model.update() — WAJIB (docs resmi: update() merefleksi
    // parameter ke vertex ArtMesh; renderer hanya mengambil hasilnya). Tanpa
    // ini, pipeline Core→renderer tidak punya siklus hidup. ──
    if (typeof model.update !== "function") {
      throw new Error("core tidak mengekspos Model.update() — cek versi core");
    }
    model.update(); // evaluasi awal pada parameter default
    // self-test sinkron: param berubah → update() → vertex berubah?
    const syncTest = (() => {
      const p = model.parameters;
      let angleX = -1;
      for (let i = 0; i < p.count; i++) if (p.ids[i] === "ParamAngleX") angleX = i;
      if (angleX < 0) return { ok: null, angleX };
      const vp0 = d.vertexPositions.subarray ? d.vertexPositions : d.vertexPositions[0];
      const probe0 = vp0[0];
      p.values[angleX] = 30;
      model.update();
      const changed = vp0[0] !== probe0;
      p.values[angleX] = 0;
      model.update();
      return { ok: changed, angleX };
    })();
    log("model.update() ✓ (evaluasi awal)" +
      (syncTest.angleX >= 0
        ? " — self-test sync: vertex " + (syncTest.ok ? "BERUBAH saat param berubah ✓" : "TIDAK berubah ✗")
        : " — ParamAngleX tidak ada, self-test dilewati"));

    // ── 4. Tekstur — PREMULTIPLY saat upload (pelajaran PATCH 6: texel kelopak
    // v6 = RGB berwarna + alpha 0; tanpa premultiply → garis merah bocor) ──
    PIXI.TextureSource.defaultOptions.alphaMode = "premultiply-alpha-on-upload";
    const textures = [];
    for (const texPath of manifest.FileReferences.Textures) {
      const blob = await (await fetch(rel(texPath))).blob();
      const bitmap = await createImageBitmap(blob);
      textures.push(PIXI.Texture.from(bitmap));
      log("tekstur: " + texPath + " (" + bitmap.width + "×" + bitmap.height + ")");
    }

    // ── 5. Render order GABUNGAN era 5.3 → permutasi padat (pelajaran PATCH 3:
    // order sparse mengosongkan slot draw; urutan relatif dipertahankan) ──
    const combined = model.getRenderOrders();
    const n = d.count;
    const idx = new Array(n);
    for (let i = 0; i < n; i++) idx[i] = i;
    idx.sort((a, b) => combined[a] - combined[b] || a - b);
    const drawOrder = new Array(n);
    for (let r = 0; r < n; r++) drawOrder[idx[r]] = r;

    // ── 6. Faktor opacity offscreen per-part (pelajaran PATCH 5: opacity grup
    // hidup di offscreens.opacities, TIDAK dibake ke drawable oleh core v6) ──
    const factorByPart = new Map();
    const offscreenOwnerParts = new Set();
    const zeroOpacityOffParts = new Set();
    if (offs) {
      for (let k = 0; k < offs.count; k++) {
        const owner = offs.ownerIndices[k];
        if (owner >= 0) {
          offscreenOwnerParts.add(owner);
          if (offs.opacities[k] <= 0) zeroOpacityOffParts.add(owner);
        }
        if (owner >= 0 && offs.opacities[k] < 1 && offs.opacities[k] > 0) {
          factorByPart.set(owner, offs.opacities[k]);
          log("offscreen[" + k + "] part " + owner + " opacity " + offs.opacities[k]);
        }
      }
    }

    // ── 7. Nama blend mode (enum resmi core) + fallback Pixi untuk frame v1 ──
    const COLOR_NAMES = {
      0: "Normal", 1: "AddCompatible", 2: "MultiplyCompatible", 3: "Add",
      4: "AddGlow", 5: "Darken", 6: "Multiply", 7: "ColorBurn",
      8: "LinearBurn", 9: "Lighten", 10: "Screen", 11: "ColorDodge",
      12: "Overlay", 13: "SoftLight", 14: "HardLight", 15: "LinearLight",
      16: "Hue", 17: "Color",
    };
    const ALPHA_NAMES = { 0: "Over", 1: "Atop", 2: "Out", 3: "ConjointOver", 4: "DisjointOver" };
    // Frame v1: hanya 4 mode klasik yang dipetakan ke Pixi; sisanya fallback
    // normal + warning — itulah gunanya golden model: melihat delta.
    const COLOR_TO_PIXI = {
      0: "normal", 1: "add", 2: "multiply", 3: "add", 4: "add",
      6: "multiply", 10: "screen",
      14: "l2d-hard-light", 17: "l2d-color",
    };
    const seenColor = new Map(), seenAlpha = new Map();

    // ── 7.5 PHASE 6C: blend 5.3 — Atop/Out/HardLight/Color sebagai
    // BlendModeFilter kustom (akses backbuffer premultiplied; matematika
    // Porter-Duff & non-separable W3C). Jalur WebGL Pixi hanya mengenal mode
    // dasar — mode advanced HARUS diregistrasi, nama lain → fallback normal.
    // BENTUK REGISTRASI (jebakan nyata): extensions.add harus menerima KELAS
    // dengan statis .extension — bentuk {extension, ref} dinormalisasi Pixi
    // jadi objek pembungkus → Ki[name] bukan konstruktor → render 500. ──
    function defineL2DBlend(name, gl, gpu) {
      const Cls = class extends PIXI.BlendModeFilter {
        constructor() { super({ gl, gpu }); }
      };
      Cls.extension = { type: "blend-mode", name };
      return Cls;
    }
    const L2D_BLENDS = {
      // Porter-Duff ATOP — GL (DST_ALPHA, ONE_MINUS_SRC_ALPHA)
      "l2d-atop": {
        gl: { functions: "", main:
          "finalColor = vec4(front.rgb * back.a + back.rgb * (1.0 - front.a), front.a * back.a + back.a * (1.0 - front.a));" },
        gpu: { functions: "", main:
          "out = vec4<f32>(front.rgb * back.a + back.rgb * (1.0 - front.a), front.a * back.a + back.a * (1.0 - front.a));" },
      },
      // OUT — GL (ONE_MINUS_DST_ALPHA, ONE): bentuk aman canvas alpha (PATCH 4c)
      "l2d-out": {
        gl: { functions: "", main:
          "finalColor = vec4(front.rgb * (1.0 - back.a) + back.rgb, front.a * (1.0 - back.a) + back.a);" },
        gpu: { functions: "", main:
          "out = vec4<f32>(front.rgb * (1.0 - back.a) + back.rgb, front.a * (1.0 - back.a) + back.a);" },
      },
      // HardLight (W3C): s<0.5 → multiply(2s,b); else screen
      "l2d-hard-light": {
        gl: { functions: "", main: `
      float as = max(front.a, 1e-4); float ab = max(back.a, 1e-4);
      vec3 Cs = front.rgb / max(front.a, 1e-4);
      vec3 Cb = back.rgb / max(back.a, 1e-4);
      vec3 B = mix(1.0 - 2.0*(1.0-Cs)*(1.0-Cb), 2.0*Cs*Cb, vec3(lessThan(Cs, vec3(0.5))));
      vec3 co = as*(1.0-ab)*Cs + as*ab*B + ab*(1.0-as)*Cb;
      finalColor = vec4(co, as + ab*(1.0-as));` },
        gpu: { functions: "", main: `
      let as = max(front.a, 0.0001); let ab = max(back.a, 0.0001);
      let Cs = front.rgb / max(front.a, 0.0001);
      let Cb = back.rgb / max(back.a, 0.0001);
      let B = select(1.0 - 2.0*(1.0-Cs)*(1.0-Cb), 2.0*Cs*Cb, Cs < vec3<f32>(0.5));
      let co = as*(1.0-ab)*Cs + as*ab*B + ab*(1.0-as)*Cb;
      out = vec4<f32>(co, as + ab*(1.0-as));` },
      },
      // Color (non-separable HSL): luminositas backdrop + warna src
      "l2d-color": {
        gl: { functions: `
      float l2dLum(vec3 c) { return 0.3*c.r + 0.59*c.g + 0.11*c.b; }
      vec3 l2dSetLum(vec3 c, float l) {
        c = c + (l - l2dLum(c));
        return clamp(c, vec3(0.0), vec3(1.0));
      }`, main: `
      float as = max(front.a, 1e-4); float ab = max(back.a, 1e-4);
      vec3 Cs = front.rgb / max(front.a, 1e-4);
      vec3 Cb = back.rgb / max(back.a, 1e-4);
      vec3 B = l2dSetLum(Cb, l2dLum(Cs));
      vec3 co = as*(1.0-ab)*Cs + as*ab*B + ab*(1.0-as)*Cb;
      finalColor = vec4(co, as + ab*(1.0-as));` },
        gpu: { functions: `
      fn l2dLum(c: vec3<f32>) -> f32 { return 0.3*c.r + 0.59*c.g + 0.11*c.b; }
      fn l2dSetLum(c0: vec3<f32>, l: f32) -> vec3<f32> {
        var c = c0 + (l - l2dLum(c0));
        return clamp(c, vec3<f32>(0.0), vec3<f32>(1.0));
      }`, main: `
      let as = max(front.a, 0.0001); let ab = max(back.a, 0.0001);
      let Cs = front.rgb / max(front.a, 0.0001);
      let Cb = back.rgb / max(back.a, 0.0001);
      let B = l2dSetLum(Cb, l2dLum(Cs));
      let co = as*(1.0-ab)*Cs + as*ab*B + ab*(1.0-as)*Cb;
      out = vec4<f32>(co, as + ab*(1.0-as));` },
      },
    };
    try {
      for (const [name, def] of Object.entries(L2D_BLENDS)) {
        PIXI.extensions.add(defineL2DBlend(name, def.gl, def.gpu));
      }
      log("blend 5.3 kustom terdaftar: " + Object.keys(L2D_BLENDS).join(", "));
    } catch (e) { warn("registrasi blend kustom gagal: " + e.message); }

    // ── 8. Normalisasi geometri SEKALI (PHASE 6A): layout core dideteksi satu
    // kali di sini — jalur render/mask/audit di bawah TIDAK bercabang lagi. ──
    const vc = d.vertexCounts, ic = d.indexCounts;
    let vOff = 0, iOff = 0;
    const vOffsets = new Array(n), iOffsets = new Array(n);
    for (let i = 0; i < n; i++) {
      vOffsets[i] = vOff; iOffsets[i] = iOff;
      vOff += vc[i]; iOff += ic[i];
    }
    const flatLayout = !!d.vertexPositions.subarray;
    const geom = new Array(n);
    for (let i = 0; i < n; i++) {
      geom[i] = {
        positions: flatLayout
          ? d.vertexPositions.subarray(vOffsets[i] * 2, (vOffsets[i] + vc[i]) * 2)
          : d.vertexPositions[i],
        uvs: flatLayout
          ? d.vertexUvs.subarray(vOffsets[i] * 2, (vOffsets[i] + vc[i]) * 2)
          : d.vertexUvs[i],
        indices: flatLayout
          ? d.indices.subarray(iOffsets[i], iOffsets[i] + ic[i])
          : d.indices[i],
      };
    }

    // ── 9. Transform Cubism dari CANVAS SPACE (PHASE 6A): model matrix resmi =
    // canvas rect (CanvasWidth/PPU × CanvasHeight/PPU), titik origin model di
    // (CanvasOriginX, CanvasOriginY) px dari kiri-atas canvas, Y ke atas.
    // Bukan bounding-box vertex — itu framing hack yang sudah diganti. ──
    const ci = model.canvasinfo;
    const unitW = ci.CanvasWidth / ci.PixelsPerUnit;
    const unitH = ci.CanvasHeight / ci.PixelsPerUnit;
    // pusat canvas dalam ruang model (unit, relatif titik origin, Y ke atas):
    const uC = (ci.CanvasWidth / 2 - ci.CanvasOriginX) / ci.PixelsPerUnit;
    const vC = (ci.CanvasOriginY - ci.CanvasHeight / 2) / ci.PixelsPerUnit;
    const s = Math.min(app.screen.width / unitW, app.screen.height / unitH) * 0.92;
    const root = new PIXI.Container();
    // screen = root + (s·u, −s·v); pusat canvas di tengah layar:
    root.position.set(app.screen.width / 2 - s * uC, app.screen.height / 2 + s * vC);
    root.scale.set(s, -s); // Y cubism = atas → layar = bawah
    app.stage.addChild(root);
    log("framing: canvas space " + unitW.toFixed(2) + "×" + unitH.toFixed(2) +
        " unit, origin (" + (ci.CanvasOriginX / ci.PixelsPerUnit).toFixed(3) + ", " +
        (ci.CanvasOriginY / ci.PixelsPerUnit).toFixed(3) + ")");

    // ── 10. Drawable → mesh Pixi 8, urut render order padat ──
    const meshes = new Array(n);
    const allGeoms = []; // geometri hidup — di-update tiap frame setelah model.update()
    for (const i of idx) {
      const geometry = new PIXI.MeshGeometry({
        positions: geom[i].positions,
        uvs: geom[i].uvs,
        indices: geom[i].indices,
      });
      allGeoms.push(geometry);
      const mesh = new PIXI.Mesh({ geometry, texture: textures[d.textureIndices[i]] });
      const colorId = d.blendModes ? d.blendModes[i] & 255 : 0;
      const alphaId = d.blendModes ? (d.blendModes[i] >>> 8) & 255 : 0;
      seenColor.set(colorId, (seenColor.get(colorId) || 0) + 1);
      seenAlpha.set(alphaId, (seenAlpha.get(alphaId) || 0) + 1);
      // Resolusi blend: alpha non-Over MENANG (satu slot blendMode) — drawable
      // dengan color blend sekaligus alpha≠Over kehilangan color-nya (warning).
      let mode;
      if (alphaId === 1) mode = "l2d-atop";
      else if (alphaId === 2) mode = "l2d-out";
      else mode = COLOR_TO_PIXI[colorId] || "normal";
      if (alphaId === 0 && !COLOR_TO_PIXI[colorId]) {
        warn("drawable " + i + " (" + COLOR_NAMES[colorId] + "): fallback normal");
      }
      if (alphaId !== 0 && colorId !== 0) {
        warn("drawable " + i + ": " + COLOR_NAMES[colorId] + "+" + ALPHA_NAMES[alphaId] +
          " — color diabaikan (satu slot blend, alpha menang)");
      }
      mesh.blendMode = mode;
      // multiplyColor Cubism 4.2+ = tint (perkalian warna tekstur per-drawable);
      // screenColor model ini nol semua → jalur screen belum diperlukan.
      if (d.multiplyColors) {
        mesh.tint = (Math.round(d.multiplyColors[i * 4] * 255) << 16) |
                    (Math.round(d.multiplyColors[i * 4 + 1] * 255) << 8) |
                    Math.round(d.multiplyColors[i * 4 + 2] * 255);
      }
      const part = d.parentPartIndices[i];
      // Faktor grup offscreen: mode composite menerapkannya di sprite komposit
      // (SEKALI, bukan per drawable); mode draw/hide tetap per-drawable.
      const groupFactor = OFFSCREEN_MODE === "composite"
        ? 1
        : (zeroOpacityOffParts.has(part) ? 0 : (factorByPart.get(part) ?? 1));
      mesh.alpha = d.opacities[i] * groupFactor;
      // Mode "hide": drawable milik part offscreen TIDAK digambar langsung.
      if (OFFSCREEN_MODE === "hide" && offscreenOwnerParts.has(part)) {
        mesh.visible = false;
      }
      // Mode composite: drawable milik part offscreen ber-opacity 0 dibuang.
      if (OFFSCREEN_MODE === "composite" && zeroOpacityOffParts.has(part)) {
        mesh.visible = false;
      }
      meshes[i] = mesh;
    }

    // ── 10.5 Offscreen composite pass (Cubism 5.3): drawable milik part
    // offscreen dirender ke RenderTexture grupnya, lalu hasilnya DIKOMPOSIT
    // ke main sebagai sprite ber-opacity grup — di posisi render order
    // GABUNGAN (offscreen k menempati combined[n+k]). ──
    const composites = [];
    if (OFFSCREEN_MODE === "composite" && offs) {
      for (let k = 0; k < offs.count; k++) {
        const op = offs.opacities[k];
        if (op <= 0) continue; // grup tak terlihat — tidak perlu RT
        const owner = offs.ownerIndices[k];
        const members = [];
        for (const i of idx) if (d.parentPartIndices[i] === owner) members.push(i);
        if (!members.length) continue;
        // Bounds layar grup dari vertex + margin (cukup untuk harness; adapter
        // kelak pakai bounds dinamis per frame / RT ukuran canvas).
        let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
        for (const i of members) {
          const pos = geom[i].positions;
          for (let v = 0; v < vc[i]; v++) {
            const sx = root.x + s * pos[v * 2], sy = root.y - s * pos[v * 2 + 1];
            if (sx < x0) x0 = sx; if (sx > x1) x1 = sx;
            if (sy < y0) y0 = sy; if (sy > y1) y1 = sy;
          }
        }
        const margin = 24;
        const rx = Math.max(0, Math.floor(x0 - margin));
        const ry = Math.max(0, Math.floor(y0 - margin));
        const rw = Math.max(4, Math.min(app.screen.width - rx, Math.ceil(x1 + margin) - rx));
        const rh = Math.max(4, Math.min(app.screen.height - ry, Math.ceil(y1 + margin) - ry));
        const container = new PIXI.Container();
        container.position.set(root.x - rx, root.y - ry);
        container.scale.copyFrom(root.scale);
        for (const i of members) container.addChild(meshes[i]);
        const rt = PIXI.RenderTexture.create({ width: rw, height: rh });
        const sprite = new PIXI.Sprite(rt);
        // PENTING: sprite ini anak root (ruang model, skala s/-s) — kompensasi
        // transform supaya rect RT mendarat persis di (rx,ry,rw,rh) layar.
        // Salah compensate = tx melompat ratusan ribu px → komposit tak tampak.
        sprite.position.set((rx - root.x) / s, (root.y - ry) / s);
        sprite.scale.set(rw / (rt.width * s), -rh / (rt.height * s));
        sprite.alpha = op;
        composites.push({ k, container, rt, sprite, order: combined[n + k] });
      }
    }
    // Urutan anak root: drawable LANGSUNG + sprite komposit, semua menurut
    // render order gabungan. Drawable yang pindah ke container offscreen dan
    // yang dibuang (grup opacity 0, mode composite) tidak masuk root.
    const children = [];
    for (const i of idx) {
      const m = meshes[i];
      if (!m.parent && !(OFFSCREEN_MODE === "composite" && !m.visible)) {
        children.push({ order: combined[i], node: m });
      }
    }
    for (const c of composites) children.push({ order: c.order, node: c.sprite });
    children.sort((a, b) => a.order - b.order);
    for (const c of children) root.addChild(c.node);

    // ── 11. Mask v1: per-drawable via Pixi mask (renderer resmi pakai clip
    // FBO — arsitektur 6C berikutnya). PENTING (poin audit #1): container mask
    // TIDAK ada di scene graph — transform-nya = world langsung, WAJIB
    // menyalin transform host mesh-nya (root ATAU container offscreen),
    // kalau tidak mask dihitung di unit-space dan clipping meleset. ──
    let maskBuilt = 0;
    for (let i = 0; i < n; i++) {
      const count = d.maskCounts[i];
      if (!count) continue;
      const host = meshes[i].parent || root;
      const maskContainer = new PIXI.Container();
      maskContainer.position.copyFrom(host.position);
      maskContainer.scale.copyFrom(host.scale);
      for (let k = 0; k < count; k++) {
        const src = d.masks[i * d.maskCountMax + k] ?? d.masks[i][k];
        if (src === undefined || src < 0) continue;
        const g = new PIXI.Mesh({
          geometry: new PIXI.MeshGeometry({
            positions: geom[src].positions,
            uvs: geom[src].uvs,
            indices: geom[src].indices,
          }),
          texture: textures[d.textureIndices[src]],
        });
        allGeoms.push(g.geometry);
        maskContainer.addChild(g);
      }
      meshes[i].mask = maskContainer;
      maskBuilt++;
      log("mask drawable " + i + " ← " + count + " sumber");
    }

    // ── 11.5 AUDIT golden — bukti numerik, bukan "kelihatannya benar": ──
    // (1) transform: satu jalur via root (mesh lokal WAJIB identitas — dua
    //     transform = posisi kacau), prediksi bounds layar vs aktual Pixi;
    // (2) mapping: drawable #i → vertex/uv #i (ukuran tepat);
    // (3) index: count benar & SEMUA indeks < vertexCount drawable sendiri
    //     (indeks milik tetangga = mesh pecah);
    // (4) uv: dalam [0,1] & textureIndex valid (binding salah = tekstur tetangga).
    const audit = {
      meshLocalIdentity: true,
      mappingFail: 0, mappingSamples: [],
      indexFail: 0, indexSamples: [],
      uvFail: 0, uvSamples: [],
      texFail: 0,
      coord: null,
    };
    for (let i = 0; i < n; i++) {
      const vp = d.vertexPositions[i], uv = d.vertexUvs[i], ix = d.indices[i];
      let bad = "";
      if (!vp || vp.length !== vc[i] * 2) bad += "vp" + (vp ? vp.length : "null") + "≠" + vc[i] * 2 + " ";
      if (!uv || uv.length !== vc[i] * 2) bad += "uv ";
      if (!ix || ix.length !== ic[i]) bad += "ix" + (ix ? ix.length : "null") + "≠" + ic[i] + " ";
      if (bad) {
        audit.mappingFail++;
        if (audit.mappingSamples.length < 4) audit.mappingSamples.push("#" + i + " " + bad);
      }
      if (ix && vp) {
        let maxIdx = -1;
        for (let k = 0; k < ix.length; k++) if (ix[k] > maxIdx) maxIdx = ix[k];
        if (maxIdx >= vc[i]) {
          audit.indexFail++;
          if (audit.indexSamples.length < 4) audit.indexSamples.push("#" + i + " idxMax " + maxIdx + " ≥ vCount " + vc[i]);
        }
      }
      if (uv) {
        for (let k = 0; k < uv.length; k++) {
          if (uv[k] < -0.002 || uv[k] > 1.002) {
            audit.uvFail++;
            if (audit.uvSamples.length < 4) audit.uvSamples.push("#" + i);
            break;
          }
        }
      }
      if (d.textureIndices[i] >= textures.length) audit.texFail++;
    }
    for (const m of meshes) {
      if (!m) continue;
      if (m.x !== 0 || m.y !== 0 || m.scale.x !== 1 || m.scale.y !== 1 || m.rotation !== 0) {
        audit.meshLocalIdentity = false;
      }
    }
    {
      // Prediksi vs aktual — dihitung HANYA dari mesh TANPA mask: quad mentah
      // mesh ber-mask membengkak (bounds efektifnya = irisan mask, tak bisa
      // dari geometri saja), dan getBounds Pixi mengabaikan mask.
      let pMinX = 1e9, pMaxX = -1e9, pMinY = 1e9, pMaxY = -1e9;
      for (let i = 0; i < n; i++) {
        const m = meshes[i];
        // hanya drawable LANGSUNG di root yang terlihat — mesh ber-mask
        // (bounds efektif = irisan mask), milik container offscreen, dan yang
        // dibuang tidak masuk perbandingan
        if (!m || m.mask || !m.visible || m.parent !== root) continue;
        const pos = geom[i].positions;
        for (let v = 0; v < vc[i]; v++) {
          const x = pos[v * 2], y = pos[v * 2 + 1];
          if (x < pMinX) pMinX = x; if (x > pMaxX) pMaxX = x;
          if (y < pMinY) pMinY = y; if (y > pMaxY) pMaxY = y;
        }
      }
      const predicted = {
        x0: root.x + s * pMinX, x1: root.x + s * pMaxX,
        y0: root.y - s * pMaxY, y1: root.y - s * pMinY,
      };
      const actual = { x0: 1e9, x1: -1e9, y0: 1e9, y1: -1e9 };
      for (const m of meshes) {
        if (!m || m.mask || !m.visible || m.parent !== root) continue;
        const b = m.getBounds();
        if (b.minX < actual.x0) actual.x0 = b.minX;
        if (b.maxX > actual.x1) actual.x1 = b.maxX;
        if (b.minY < actual.y0) actual.y0 = b.minY;
        if (b.maxY > actual.y1) actual.y1 = b.maxY;
      }
      const dxy = {
        dx0: Math.abs(predicted.x0 - actual.x0), dx1: Math.abs(predicted.x1 - actual.x1),
        dy0: Math.abs(predicted.y0 - actual.y0), dy1: Math.abs(predicted.y1 - actual.y1),
      };
      audit.coord = {
        predicted, actual,
        maxDelta: Math.max(dxy.dx0, dxy.dx1, dxy.dy0, dxy.dy1),
        ok: Math.max(dxy.dx0, dxy.dx1, dxy.dy0, dxy.dy1) < 2 &&
            audit.meshLocalIdentity,
      };
    }

    // ── 12. Loop hidup (PHASE 6A-8): param → model.update() → upload vertex →
    // render. Head-turn sin membuktikan rantai sinkron Core→Pixi bekerja
    // (vertex buffer ikut berubah tiap frame). Matikan via ?static. Watchdog
    // 250ms tetap (pelajaran tab ter-occlude). ──
    const STATIC = new URLSearchParams(location.search).has("static");
    const params = model.parameters;
    const angleXIdx = (() => { for (let i = 0; i < params.count; i++) if (params.ids[i] === "ParamAngleX") return i; return -1; })();
    const angleYIdx = (() => { for (let i = 0; i < params.count; i++) if (params.ids[i] === "ParamAngleY") return i; return -1; })();
    let lastTick = performance.now();
    // PENTING (jebakan nyata): callback ini WAJIB jalan SETELAH render utama
    // (TickerPlugin memakai priority LOW=-25). Kalau render RT dilakukan
    // SEBELUM render utama, state render target/proyeksi ikut kacau → model
    // tergambar dobel di canvas. Priority LOW-1 = update + RT render terjadi
    // setelah present; komposit tertinggal satu frame (wajar untuk harness).
    app.ticker.add(() => {
      const t = app.ticker.lastTime / 1000;
      if (!STATIC && angleXIdx >= 0) {
        params.values[angleXIdx] = Math.sin(t * 1.1) * 30;
        if (angleYIdx >= 0) params.values[angleYIdx] = Math.sin(t * 0.7) * 15;
        model.update(); // core hitung ulang vertex dari parameter
        for (const geo of allGeoms) geo.getBuffer("aPosition").update(); // upload ke GPU
      }
      // Composite pass offscreen: render tiap grup ke RenderTexture-nya.
      for (const comp of composites) {
        app.renderer.render({ container: comp.container, target: comp.rt, clear: true });
      }
      lastTick = performance.now();
    }, null, PIXI.UPDATE_PRIORITY.LOW - 1);
    setInterval(() => {
      if (performance.now() - lastTick > 250) app.ticker.update();
    }, 250);

    // ── 13. Kartu laporan golden ──
    const colorUsed = [...seenColor.entries()]
      .map(([id, c]) => COLOR_NAMES[id] + "×" + c).join(", ");
    const alphaUsed = [...seenAlpha.entries()]
      .map(([id, c]) => ALPHA_NAMES[id] + "×" + c).join(", ");
    log([
      "",
      "=== GOLDEN REPORT — ren (moc v" + headerV + ") ===",
      "core: " + coreStr +
        " | pipeline: Cubism 5.3 (offscreen " + (offs ? offs.count : 0) + ")",
      "drawable " + n + " | part " + parts.count + " | param " + model.parameters.count,
      "mask: " + maskBuilt + " drawable | blend color: " + colorUsed,
      "alpha: " + alphaUsed,
      "AUDIT mapping: " + (audit.mappingFail ? "GAGAL " + audit.mappingFail + " " + audit.mappingSamples.join("; ") : "OK (198× vertex/uv/index sesuai)"),
      "AUDIT index: " + (audit.indexFail ? "GAGAL " + audit.indexFail + " " + audit.indexSamples.join("; ") : "OK (semua indeks < vertexCount sendiri)"),
      "AUDIT uv/tekstur: " + (audit.uvFail || audit.texFail ? "GAGAL uv=" + audit.uvFail + " tex=" + audit.texFail : "OK (uv 0..1, binding valid)"),
      "AUDIT transform: " + (audit.coord && audit.coord.ok
        ? "OK (mesh lokal identitas, prediksi≈aktual Δ" + audit.coord.maxDelta.toFixed(3) + "px)"
        : "GAGAL " + JSON.stringify(audit.coord)),
      warnings.length ? "fallback/warning: " + warnings.length : "tanpa fallback",
      "offscreen: " + OFFSCREEN_MODE +
        (OFFSCREEN_MODE === "composite" ? " (" + composites.length + " grup RT dikomposit)" : ""),
      "update(): awal + per frame | sync self-test: " +
        (syncTest.angleX >= 0 ? (syncTest.ok ? "OK (vertex berubah)" : "GAGAL") : "n/a") +
        " | anim: " + (STATIC ? "static (?static)" : "ParamAngleX/Y ✓"),
      "render: PixiJS " + PIXI.VERSION + " → canvas ✓ (offscreen=" + OFFSCREEN_MODE + ")",
    ].join("\n"), warnings.length ? "warn" : "ok");

    window.__golden = {
      app, model, meshes, root, ok: true, warnings, audit, composites,
      report: { mocVersion: headerV, drawables: n, parts: parts.count,
        params: model.parameters.count, offscreens: offs ? offs.count : 0,
        maskBuilt, colorUsed, alphaUsed, warnings: warnings.length },
    };
  } catch (e) {
    console.error(e);
    window.__golden = { ok: false, error: String((e && e.message) || e) };
    log("GAGAL: " + ((e && e.message) || e), "fail");
  }
})();
</script>
</body>
</html>
